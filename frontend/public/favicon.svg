<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Emerald Glow / Ring -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="url(#pulseGrad)" stroke-width="4" opacity="0.3" />

  <!-- Central Emerald Gradient Badge -->
  <rect x="72" y="72" width="368" height="368" rx="76" fill="url(#pulseGrad)" />

  <!-- Inner Dark Chat Bubble -->
  <path d="M152 160 h208 a32 32 0 0 1 32 32 v116 a32 32 0 0 1 -32 32 h-132 l-52 44 v-44 h-24 a32 32 0 0 1 -32 -32 v-116 a32 32 0 0 1 32 -32 z"
        fill="#0B1120" />

  <!-- Heartbeat / Pulse ECG Waveform inside bubble -->
  <path d="M168 256 h38 l18 -42 l26 84 l30 -106 l24 82 l18 -18 h40"
        fill="none"
        stroke="url(#lineGrad)"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Live Active Dot -->
  <circle cx="362" cy="256" r="9" fill="#86EFAC" />
</svg>